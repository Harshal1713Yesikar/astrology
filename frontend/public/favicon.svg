<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#070D1E" stroke="url(#grad)" stroke-width="2" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="1" stroke-dasharray="2 3" />
  <!-- Crescent Moon -->
  <path d="M 44 26 A 24 24 0 1 0 72 62 A 20 20 0 1 1 44 26 Z" fill="url(#grad)" filter="url(#glow)" />
  <!-- Celestial 8-pointed star -->
  <polygon points="62,32 64,39 71,41 64,43 62,50 60,43 53,41 60,39" fill="#FFFBEB" filter="url(#glow)" />
  <!-- Small Star -->
  <circle cx="36" cy="38" r="1.5" fill="#FDE68A" />
  <circle cx="42" cy="70" r="1.2" fill="#FDE68A" />
  <circle cx="68" cy="65" r="1.5" fill="#FDE68A" />
</svg>
